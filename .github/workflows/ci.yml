name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web (format, typecheck, tests, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun x prettier --check .

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun run test

      - name: Production build
        run: bun run build

  rust:
    name: Rust (fmt, tests, clippy)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Stage externalBin placeholder
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/stage-admin-sidecar.ps1

      - name: rustfmt check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Unit tests
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Check all binaries compile
        run: cargo check --manifest-path src-tauri/Cargo.toml --bins --locked
