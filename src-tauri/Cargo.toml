[package]
name = "opencode-egress-manager"
version = "3.0.0"
description = "Windows-first egress manager for OpenCode"
authors = ["Opencode Egress Manager contributors"]
edition = "2021"
rust-version = "1.95"

[lib]
name = "egress_manager"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "opencode-egress-manager"
path = "src/main.rs"

[[bin]]
name = "egress-manager-admin"
path = "src/bin/admin.rs"

[build-dependencies]
tauri-build = { version = "=2.7.5", features = [] }

[dependencies]
tauri = { version = "=2.12.6", features = [] }
tokio = { version = "=1.54.1", features = ["full"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_IO",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
sysinfo = "=0.40.4"
reqwest = { version = "=0.13.5", default-features = false, features = [
  "rustls",
  "json",
  "stream",
  "socks",
  "http2",
  "charset",
] }
sha2 = "=0.11.1"
flate2 = "=1.1.11"
tar = "=0.4.46"
rusqlite = { version = "=0.43.0", features = ["bundled"] }
rand = "=0.10.4"
regex = "=1.13.2"
url = "=2.5.8"
percent-encoding = "=2.3.2"
chrono = "=0.4.45"
once_cell = "=1.21.4"
base64 = "=0.23.1"
which = "=8.0.6"
open = "=5.4.5"
futures-util = "=0.3.34"
tokio-util = "=0.7.20"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
